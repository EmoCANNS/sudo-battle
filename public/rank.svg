<!-- DÜZELTİLMİŞ VE DAHA HAVALI RANK SVG İKONLARI -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <defs>
      <linearGradient id="bronze-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#cd7f32" /><stop offset="100%" stop-color="#5c2c16" />
      </linearGradient>
      <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ecf0f1" /><stop offset="100%" stop-color="#7f8c8d" />
      </linearGradient>
      <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f1c40f" /><stop offset="100%" stop-color="#d35400" />
      </linearGradient>
      <linearGradient id="plat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1abc9c" /><stop offset="100%" stop-color="#0f2b2a" />
      </linearGradient>
      <linearGradient id="diamond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e056fd" /><stop offset="100%" stop-color="#4834d4" />
      </linearGradient>
      <linearGradient id="master-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff4757" /><stop offset="100%" stop-color="#2f3542" />
      </linearGradient>
      <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="glow" />
        <feComposite in="SourceGraphic" in2="glow" operator="over" />
      </filter>
    </defs>

    <!-- BRONZ -->
    <g id="rank-bronze" filter="url(#neon-glow)">
      <polygon points="25,2 48,16 48,44 25,58 2,44 2,16" fill="#1a0f0d" stroke="url(#bronze-grad)" stroke-width="3"/>
      <polygon points="25,10 40,20 40,40 25,50 10,40 10,20" fill="url(#bronze-grad)" opacity="0.8"/>
      <circle cx="25" cy="30" r="7" fill="#fff" opacity="0.9"/>
    </g>

    <!-- GÜMÜŞ -->
    <g id="rank-silver" filter="url(#neon-glow)">
      <polygon points="25,2 48,16 48,44 25,58 2,44 2,16" fill="#141a1f" stroke="url(#silver-grad)" stroke-width="3"/>
      <polygon points="25,10 40,20 40,40 25,50 10,40 10,20" fill="url(#silver-grad)" opacity="0.8"/>
      <polygon points="25,18 33,30 25,42 17,30" fill="#fff"/>
    </g>

    <!-- ALTIN -->
    <g id="rank-gold" filter="url(#neon-glow)">
      <polygon points="25,1 49,15 49,45 25,59 1,45 1,15" fill="#1f1808" stroke="url(#gold-grad)" stroke-width="3.5"/>
      <polygon points="25,8 42,18 42,42 25,52 8,42 8,18" fill="url(#gold-grad)"/>
      <polygon points="25,16 34,28 25,40 16,28" fill="#fff"/>
    </g>

    <!-- PLATİN -->
    <g id="rank-platinum" filter="url(#neon-glow)">
      <path d="M25,2 L48,25 L25,58 L2,25 Z" fill="#08201e" stroke="url(#plat-grad)" stroke-width="3.5"/>
      <path d="M25,10 L40,25 L25,48 L10,25 Z" fill="url(#plat-grad)"/>
      <polygon points="25,18 33,25 25,36 17,25" fill="#fff"/>
    </g>

    <!-- ELMAS -->
    <g id="rank-diamond" filter="url(#neon-glow)">
      <path d="M25,1 L49,18 39,57 11,57 1,18 Z" fill="#140821" stroke="url(#diamond-grad)" stroke-width="3.5"/>
      <polygon points="25,8 41,20 35,48 15,48 9,20" fill="url(#diamond-grad)"/>
      <polygon points="25,16 33,26 25,40 17,26" fill="#fff"/>
    </g>

    <!-- ÜSTAT (MASTER) -->
    <g id="rank-master" filter="url(#neon-glow)">
      <path d="M25,1 L49,12 49,39 25,59 1,39 1,12 Z" fill="#21080c" stroke="url(#master-grad)" stroke-width="4"/>
      <path d="M25,7 L43,15 L43,35 L25,51 L7,35 L7,15 Z" fill="url(#master-grad)"/>
      <polygon points="25,14 35,26 25,42 15,26" fill="#fff"/>
      <circle cx="25" cy="28" r="4" fill="#ffeb3b"/>
    </g>
  </svg>